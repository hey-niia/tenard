function set(patch, botDelay) {
  if (botDelay) {
    S.typing = true; render();
    setTimeout(() => { Object.assign(S, patch, { typing: false }); render(); }, botDelay);
  } else { Object.assign(S, patch); render(); }
}
const go = (patch) => () => set(patch, 700);

/* ---------- the conversation ---------- */
function conversation() {
  const m = [];
  const bot = (t) => m.push({ t: 'bot', text: t });
  const user = (t) => m.push({ t: 'user', text: t });
  let chips = [];

  bot("Hi, I'm Tenard. What's going on at home? Start a case with one tap, or just describe it.");
  if (!S.type) { m.push({ t: 'suggest' }); return { m, chips, kase: null }; }

  const T = TYPES[S.type];
  user(S.typedFirst ? S.desc : '+ ' + T.label);
  m.push({ t: 'system', text: T.title });
  bot('Case started. ' + T.ask);
  if (S.step === 1) chips = [{ label: 'Add photo or video', attach: true }, { label: 'Use a sample photo', go: go({ step: 2 }) }];

  let res = null, title = T.title, status = 'New · add evidence', diy = false;
  if (S.step >= 2) {
    const evText = S.desc2 || (S.typedFirst ? null : (S.desc || T.desc));
    if (evText) user(evText);
    m.push({ t: 'photo', tag: T.tag });
    status = 'Checking';
    if (S.type === 'mould') {
      bot('I can see mould on the ceiling, about 15 sq ft, next to a water stain. That usually means a leak from above.\n\nTwo quick questions so I check the right rules.');
      bot('Is it inside your apartment, or in a hallway or laundry room?');
      if (S.step === 2) chips = [{ label: 'Inside my apartment', go: go({ step: 3 }) }, { label: 'Hallway or laundry', go: go({ step: 3 }) }];
      if (S.step >= 3) {
        user('Inside my apartment');
        bot('Is it only on tile, grout or caulk, or on the ceiling or wall?');
        if (S.step === 3) chips = [{ label: 'On the ceiling', go: go({ step: 4, path: 'ceiling' }) }, { label: 'Only on tile or grout', go: go({ step: 4, path: 'tile' }) }];
      }
      if (S.step >= 4 && S.path === 'tile') {
        user('Only on tile or grout');
        bot("Then it's not a violation. Surface mould on intact tile, grout or caulk is usually the tenant's to clean. These would do it:");
        m.push({ t: 'shop' });
        bot("If it comes back fast or spreads past the tile, film it again. That can mean a leak behind the wall, and that's your landlord's job.");
        title = 'Shower grout mould'; status = 'Not a violation · yours to fix'; diy = true;
        chips = [{ label: 'Film it again', go: go({ step: 1 }) }];
      }
      if (S.step >= 4 && S.path === 'ceiling') { user('On the ceiling'); res = MOULD_RES; }
    } else {
      bot(T.see);
      bot(T.q);
      if (S.step === 2) chips = T.opts.map((o) => ({ label: o.label, go: go({ step: 4, answer: o.r, answerLabel: o.label }) }));
      if (S.step >= 4) { user(S.answerLabel); res = T.res[S.answer]; }
    }
  }

  if (res) {
    title = res.title;
    status = res.cls + ' · new';
    m.push({ t: 'finding', res });
    bot(res.say);
    if (S.asked) {
      user('Will I get in trouble for complaining?');
      bot("It's illegal for your landlord to punish you for complaining. If they try to evict you or raise your rent within a year of a complaint or inspection, the law presumes it's retaliation (NY Real Property Law § 223-b).\n\nThis doesn't apply if the owner lives in a building with fewer than 4 units.");
    }
    if (S.step === 4) {
      chips = [{ label: 'What do I do now?', go: go({ step: 5 }) }];
      if (!S.asked) chips.push({ label: 'Will I get in trouble?', go: go({ asked: true }) });
    }
    if (S.step >= 5) {
      user('What do I do now?');
      bot('Step 1: tell your landlord in writing. HPD and Housing Court both expect that first. I drafted it for you. Keep a copy and proof it was delivered.');
      m.push({ t: 'draft', title, res });
      status = res.cls + ' · notice ready';
      if (S.step === 5) chips = [{ label: 'I sent it', go: go({ step: 6 }) }];
    }
    if (S.step >= 6) {
      user('I sent it');
      bot("Saved to your case. I'll check in on Dec 5. If it isn't fixed by then, we'll file a 311 complaint together so HPD inspects.");
      status = res.cls + ' · waiting on landlord';
      if (S.step === 6) chips = [{ label: 'Skip to Dec 5', dark: true, go: go({ step: 7 }) }, { label: 'Open my case', go: () => set({ view: 'case' }) }];
    }
  }

  /* ---------- escalation: notice → 311 → HPD inspection → violation → HP action ---------- */
  const vClass = res && res.label === 'Inspector decides' ? 'Class B' : res ? res.cls : '';
  const vDays = res && res.label === 'Inspector decides' ? '30 days' : res ? res.days : '';
  const dueDate = { '21 days': 'Jan 8', '30 days': 'Jan 17', '90 days': 'Mar 18' }[vDays] || 'Jan 17';
  let fixedOn = null;
  const verify = (when) => {
    fixedOn = when;
    user('Fixed');
    bot('Good news. Send a photo of the repaired spot so your case has proof it was done.');
    if (!S.verified) {
      chips = [{ label: 'Add photo of the repair', attach: true, verify: true }, { label: 'Use a sample photo', go: go({ verified: true }) }];
    } else {
      m.push({ t: 'photo', tag: 'Photo · after the repair', after: true });
      bot('Case closed. It stays in your record, so if the problem comes back you can reopen it with the full history.');
      m.push({ t: 'system', text: title, closed: true });
      status = 'Resolved · ' + when;
      chips = [];
    }
  };

  if (res && S.step >= 7) {
    m.push({ t: 'date', text: 'Dec 5 · check-in' });
    bot("It's Dec 5. Did your landlord fix it?");
    if (S.step === 7 && !S.fixed) chips = [{ label: 'Not fixed', go: go({ step: 8 }) }, { label: 'Fixed', go: go({ fixed: true }) }];
    if (S.step === 7 && S.fixed) verify('Dec 5');
  }
  if (res && S.step >= 8) {
    user('Not fixed');
    bot("Then it's time to file with 311, so HPD sends an inspector. Here's your complaint in the city's own categories. Paste it into 311 online, or read it out on the phone.");
    m.push({ t: 'complaint', title, T });
    bot("When you file, you'll get a service request number. Send it to me and I'll track the inspection.");
    status = res.cls + ' · file with 311';
    if (S.step === 8) chips = [{ label: 'I filed it', go: go({ step: 9 }) }];
  }
  if (res && S.step >= 9) {
    user('Filed. My number is 311-[number]');
    bot("Saved to your case. HPD aims to inspect within 30 days. If the inspector can't get in, call 311 within 10 days to reschedule.\n\nYour landlord can't punish you for this complaint.");
    status = res.cls + ' · waiting for inspection';
    if (S.step === 9) chips = [{ label: 'Skip to the inspection', dark: true, go: go({ step: 10 }) }];
  }
  if (res && S.step >= 10) {
    m.push({ t: 'date', text: 'Dec 18 · inspection' });
    bot('How did the HPD inspection go?');
    if (S.missed) {
      user("The inspector couldn't get in");
      bot("Call 311 within 10 days to reschedule, and give them your service request number. Tell me how it goes when they come back.");
    }
    if (S.step === 10) {
      chips = [{ label: 'Violation issued', go: go({ step: 11, insp: 'violation' }) }, { label: 'No violation', go: go({ step: 11, insp: 'none' }) }];
      if (!S.missed) chips.push({ label: "Couldn't get in", go: go({ missed: true }) });
    }
  }
  if (res && S.step >= 11 && S.insp === 'violation') {
    user('They issued a violation');
    bot(`HPD issued a ${vClass} violation. It's now public on HPDONLINE, and your landlord's deadline starts today: fix by ${dueDate}.\n\nThis is the official record a court will look at.`);
    status = `${vClass} violation · fix by ${dueDate}`;
    if (S.step === 11) chips = [{ label: 'Skip to ' + dueDate, dark: true, go: go({ step: 12 }) }];
  }
  if (res && S.step >= 11 && S.insp === 'none') {
    user('No violation');
    bot("That happens. If the problem is still there, you don't have to stop. When HPD hasn't issued a violation within 30 days of your complaint, you can ask Housing Court to order the repair. That's called an HP action.");
    status = res.cls + ' · no violation issued';
    if (S.step === 11) chips = [{ label: 'Go to Housing Court', go: go({ step: 13 }) }];
  }
  if (res && S.step >= 12 && S.insp === 'violation') {
    m.push({ t: 'date', text: dueDate + ' · deadline' });
    bot("Today was your landlord's deadline. Did they fix it?");
    if (S.step === 12 && !S.fixed) chips = [{ label: 'Not fixed', go: go({ step: 13 }) }, { label: 'Fixed', go: go({ fixed: true }) }];
    if (S.step === 12 && S.fixed) verify(dueDate);
  }
  if (res && S.step >= 13) {
    user(S.insp === 'none' ? 'Go to Housing Court' : 'Not fixed');
    bot("Then you can ask Housing Court to order the repair. That's an HP action. The court clerk gives you the forms, and your case already has most of what the judge will want to see:");
    m.push({ t: 'checklist' });
    bot('You also have the right to talk to a free tenant lawyer before you go.' + (RENT_STABILIZED ? "\n\nBecause you're rent-stabilized, you can also ask DHCR to lower your rent until it's fixed." : ''));
    status = 'HP action · Housing Court';
    if (S.exported) m.push({ t: 'file', title });
    chips = S.exported ? [{ label: 'Open my case', dark: true, go: () => set({ view: 'case' }) }] : [{ label: 'Export evidence packet', dark: true, go: go({ exported: true }) }];
  }

  chips.push({ label: 'Start over', go: () => set(Object.assign({}, FRESH)) });
  const stage = {
    filed: !!res && S.step >= 9, violation: !!res && S.step >= 11 && S.insp === 'violation', noViolation: !!res && S.step >= 11 && S.insp === 'none',
    court: !!res && S.step >= 13, resolved: !!res && S.verified, fixedOn, vClass, dueDate, filing: !!res && S.step === 8
  };
  return { m, chips, kase: { title, status, res, diy, T, sent: S.step >= 6, hasEvidence: S.step >= 2, stage } };
}

function draftBody(title, res) {
  if (S.type === 'mould') return 'There is mould on the bathroom ceiling of Apt 4B, about 15 sq ft, caused by a leak from above. I reported it to the super on Oct 14 and Oct 28. Under the NYC Housing Maintenance Code (§ [section]) this is a hazardous (Class B) condition…';
  const cond = res.label === 'Inspector decides' ? 'a condition you are required to repair' : `a ${res.cls} condition`;
  const extra = S.type === 'window' && S.answer === 1 ? ' Please treat this letter as my written request for window guards.' : '';
  return `I am writing about a problem in Apt 4B: ${title.toLowerCase()}. Photos are attached. Under the NYC Housing Maintenance Code (§ [section]) this is ${cond}.${extra} Please repair it…`;
}

function msgHTML(x) {
  switch (x.t) {
    case 'bot': return `<div class="row"><div class="bot">${esc(x.text)}</div></div>`;
    case 'user': return `<div class="row me"><div class="user">${esc(x.text)}</div></div>`;
    case 'suggest': return `<div class="row"><div class="card">
      <div style="padding:12px 12px 10px"><span class="eyebrow">Start a case</span></div>
      ${Object.entries(TYPES).map(([k, T]) => `<button class="sug" data-type="${k}"><span class="plus">${ICON.plus(16)}</span><span style="flex:1"><b>${esc(T.label)}</b><span class="sub">${esc(T.hint)}</span></span></button>`).join('')}
      </div></div>`;
    case 'photo': {
      const src = x.after ? S.afterPhoto : S.photo;
      return `<div class="row me"><div class="ph" style="width:210px;height:150px">${src ? `<img src="${src}" alt="Your photo">` : ICON.xph(210, 150)}<span class="tag">${src ? 'Your upload' : esc(x.tag)}</span></div></div>`;
    }
    case 'system': return `<button class="sys" data-act="case"><span style="text-align:center;max-width:75%">${x.closed ? 'Case resolved' : 'Case started'}: <b style="color:#3B221C">${esc(x.text)}</b> · Open</span></button>`;
    case 'date': return `<div style="text-align:center;padding:10px 0 2px"><span style="font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 10px">${esc(x.text)}</span></div>`;
    case 'complaint': return `<div class="row"><div class="card">
      <div style="padding:10px 12px;border-bottom:1px solid var(--line)"><span class="eyebrow">311 complaint · ready to file</span></div>
      <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px"><span class="sub">Complaint type</span><b style="font-size:14px">[311 type] › [HPD category]</b></div>
      <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><span><span class="sub">Where</span><br><b style="font-size:14px">${esc(x.T.where)}</b></span><span><span class="sub">Apartment</span><br><b style="font-size:14px">4B</b></span></div>
      <div style="padding:10px 12px;font-size:13px;line-height:1.5;color:var(--soft)">${esc(x.title)}. Written notice to landlord sent Nov 21 with photos. Not repaired as of Dec 5.</div>
      <div class="btnrow"><button data-act="copy">Copy text</button><button class="primary" data-act="mail">Open 311 online</button></div></div></div>`;
    case 'checklist': {
      const items = [
        ['Dated photos and video', true], ['Written notice to landlord · Nov 21', true], ['311 service request number', true],
        ['HPD violation number (HPDONLINE)', S.insp === 'violation'], ['Proof the notice was delivered', false],
        ['Lease and rent receipts', false], ['How it affects you, in your words', false]
      ];
      const done = items.filter((i) => i[1]).length;
      return `<div class="row"><div class="card">
        <div style="padding:10px 12px;display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Evidence for court</span><span class="sub">${done} of ${items.length} ready</span></div>
        ${items.map(([label, ok]) => `<div style="display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid #F0E9DE;font-size:14px"><span style="width:20px;height:20px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;${ok ? 'background:#3B221C;color:var(--cream)' : 'border:1.5px solid #3B221C'}">${ok ? ICON.check : ''}</span><span style="flex:1${ok ? '' : ';color:var(--soft)'}">${esc(label)}</span>${ok ? '' : '<span style="font-size:13px;font-weight:600;text-decoration:underline">Add</span>'}</div>`).join('')}
      </div></div>`;
    }
    case 'file': return `<div class="row"><div class="card" style="display:flex;gap:12px;align-items:center;padding:12px">
      <span style="width:40px;height:48px;border:1.5px solid #3B221C;border-radius:4px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-weight:700">PDF</span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><b style="font-size:14px">Evidence packet</b><span class="sub">${esc(x.title)} · dated, in order</span></span>
      <button class="chip" style="min-height:36px">Download</button></div></div>`;
    case 'finding': return `<div class="row"><div class="card"><div class="pad">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow">Possible violation</span><span class="chip-lbl">${esc(x.res.label)}</span></div>
      <div class="grid2"><div class="tile"><span class="big">${esc(x.res.cls)}</span><span class="sub">${esc(x.res.sub)}</span></div><div class="tile"><span class="big">${esc(x.res.days)}</span><span class="sub">${esc(x.res.daysSub)}</span></div></div>
      <span style="font-size:13px">NYC Housing Maintenance Code § [section] · <a href="#" data-act="case" style="font-weight:600">See the rule</a></span>
      <span class="sub" style="line-height:1.4">Not an official finding. Only an HPD inspector can issue a violation.</span></div></div></div>`;
    case 'draft': return `<div class="row"><div class="card">
      <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:12px"><span><span style="color:var(--muted)">To: </span>[Landlord / management]</span><span><span style="color:var(--muted)">Subject: </span>Repair request: ${esc(x.title)}, Apt 4B</span></div>
      <div style="padding:10px 12px;font-size:13px;line-height:1.5;color:var(--soft)">${esc(draftBody(x.title, x.res))}</div>
      <div style="padding:0 12px 10px" class="sub">Photos attached</div>
      <div class="btnrow"><button>Edit</button><button data-act="copy">Copy</button><button class="primary" data-act="mail">Open in email</button></div></div></div>`;
    case 'shop': return `<div class="row"><div class="card">
      <div style="padding:10px 12px;display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Fix it yourself</span><span class="sub" style="font-size:11px">from Shopify stores</span></div>
      ${['Mould and mildew remover', 'Grout scrub brush', 'Mould-resistant caulk'].map((p) => `<a class="shop" href="#"><span class="th"></span><span style="flex:1"><b>[${p}]</b><span class="sub">[Store] · $[price]</span></span><span style="font-size:13px;font-weight:600">View</span></a>`).join('')}
      </div></div>`;
  }
  return '';
}

/* ---------- views ---------- */
function chatView(conv) {
  const { m, chips, kase } = conv;
  const pin = kase
    ? `<button class="pin" data-act="case"><span class="ic">${ICON.doc}</span><span style="flex:1;min-width:0"><b>${esc(kase.title)}</b><small>${esc(kase.status)}</small></span>${ICON.chev}</button>`
    : '';
  const typing = S.typing ? `<div class="row"><div class="bot"><span class="typing"><i></i><i></i><i></i></span></div></div>` : '';
  const placeholder = S.step === 1 ? 'Where, since when, who you told' : 'Describe the problem, any language';
  return `
    <div class="nav">
      <button class="navbtn" aria-label="Your cases, ${openCount(kase)} open" data-act="cases">${ICON.doc}<span class="count" aria-hidden="true">${openCount(kase)}</span></button>
      <span class="navtitle">${kase ? 'Case chat' : 'New case'}</span>
      ${kase ? `<button class="navbtn" aria-label="Start a new case" data-act="new">${ICON.compose}</button>` : '<span></span>'}
    </div>
    ${pin}
    <div class="scroll" id="scroll">${m.map(msgHTML).join('')}${typing}</div>
    <div class="chips">${S.typing ? '' : chips.map((c, i) => `<button class="chip${c.dark ? ' dark' : ''}" data-chip="${i}">${esc(c.label)}</button>`).join('')}</div>
    <form class="input" id="composer">
      <button type="button" class="round out" aria-label="Add photo or video" data-act="attach">${ICON.cam}</button>
      <input type="text" id="msg" aria-label="Message" placeholder="${placeholder}" autocomplete="off">
      <button type="submit" class="round fill" aria-label="Send">${ICON.send}</button>
    </form>`;
}

function caseView(kase) {
  if (!kase) return '';
  const r = kase.res;
  const g = kase.stage;
  const [statusMain, statusSub] =
    g.resolved ? ['Resolved', 'Repair confirmed with a photo · ' + g.fixedOn]
    : g.court ? ['HP action · Housing Court', S.exported ? 'Evidence packet exported' : 'Export the evidence packet in the chat']
    : g.violation ? [`HPD ${g.vClass} violation`, 'Landlord must fix by ' + g.dueDate]
    : g.noViolation ? ['No violation issued', 'You can still start an HP action']
    : g.filed ? ['Waiting for HPD inspection', '311 filed Dec 5 · HPD aims to inspect within 30 days']
    : g.filing ? ['File with 311', 'Complaint text ready in the chat']
    : kase.sent ? ['Waiting on landlord', 'Notice sent Nov 21 · follow up Dec 5']
    : kase.diy ? ['Yours to fix', 'Not a violation · products suggested in chat']
    : r ? ['Notice not sent yet', 'Draft ready in the chat']
    : kase.hasEvidence ? ['Checking', 'Answer a quick question in the chat']
    : ['Add evidence', 'Photos, video and a short description'];
  const stepNow = g.court ? 4 : (g.violation || g.noViolation) ? 3 : g.filed || g.filing ? 2 : 1;
  const finding = r ? `<div class="boxed">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow">Possible violation</span><span class="chip-lbl">${esc(r.label)}</span></div>
      <div class="grid2"><div><span class="big">${esc(r.cls)}</span><div class="sub">${esc(r.sub)}</div></div><div><span class="big">${esc(r.days)}</span><div class="sub">${esc(r.daysSub)}</div></div></div>
      <span style="font-size:13px">NYC Housing Maintenance Code § [section]</span>
      ${S.type === 'mould' ? '<div style="border-top:1px solid #F0E9DE;padding-top:8px;display:flex;justify-content:space-between;font-size:13px"><span>Water stain (leak)</span><b>Inspector decides</b></div>' : ''}
    </div>` : kase.diy ? `<div class="boxed"><span class="eyebrow">Result</span><b style="font-size:15px">Not a violation</b><span class="sub" style="font-size:13px">Surface mould on intact tile, grout or caulk is the tenant's to clean. Film again if it spreads.</span></div>`
    : `<div class="boxed"><span class="eyebrow">Not checked yet</span><span class="sub" style="font-size:13px">${kase.hasEvidence ? 'Answer the question in the chat to finish the check.' : 'Add photos and a description in the chat. Tenard will check it against the rules.'}</span></div>`;
  const steps = r ? `<div class="section" style="gap:0"><span class="eyebrow" style="padding-bottom:10px">Steps</span>
      <div class="step"><div class="rail"><span class="dot${kase.sent ? ' done' : ''}">${kase.sent ? ICON.check : '1'}</span><span class="ln"></span></div><div class="txt"><b>Written notice to landlord</b><span>${kase.sent ? 'Sent Nov 21' : 'Ready to send'}</span></div></div>
      <div class="step"><div class="rail"><span class="dot${g.filed ? ' done' : ''}">${g.filed ? ICON.check : '2'}</span><span class="ln"></span></div><div class="txt"><b>311 complaint → HPD inspection</b><span>${g.filed ? 'Filed Dec 5 · 311-[number]' : 'If not fixed by Dec 5 · HPD aims to inspect within 30 days'}</span></div></div>
      <div class="step"><div class="rail"><span class="dot${g.violation ? ' done' : ''}">${g.violation ? ICON.check : '3'}</span><span class="ln"></span></div><div class="txt"><b>HPD issues a violation</b><span>${g.violation ? `${g.vClass} · issued Dec 18 · fix by ${g.dueDate}` : g.noViolation ? 'Inspected Dec 18 · no violation issued' : "The landlord's deadline starts"}</span></div></div>
      <div class="step"><div class="rail"><span class="dot${g.court ? ' done' : ''}">${g.court ? ICON.check : '4'}</span></div><div class="txt"><b>HP action in Housing Court</b><span>${g.court ? (S.exported ? 'Evidence packet ready for the clerk' : 'Started · export the evidence packet') : "If the violation isn't fixed"}</span></div></div>
    </div>` : '';
  const ready = (kase.hasEvidence ? 1 : 0) + (r ? 1 : 0) + (kase.sent ? 1 : 0) + (S.type === 'mould' ? 1 : 0) + (g.filed ? 1 : 0) + (g.violation ? 1 : 0);
  return `
    <div class="nav">
      <button class="back" data-act="chat">${ICON.back}Chat</button>
      <span class="navtitle">Case</span>
      <button class="navbtn" aria-label="Your cases, ${openCount(kase)} open" data-act="cases">${ICON.doc}<span class="count" aria-hidden="true">${openCount(kase)}</span></button>
    </div>
    <div class="page">
      <div class="section" style="gap:4px"><h1 style="margin:0;font-size:24px">${esc(kase.title)}</h1><span class="sub" style="font-size:13px">[Address], Apt 4B · started Nov 21</span></div>
      <div class="boxed strong" style="flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px">
        <span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:15px">${statusMain}</b><span class="sub" style="font-size:13px">${statusSub}</span></span>
        ${g.resolved ? '<span class="badge">Closed</span>' : r ? `<span class="badge">Step ${stepNow} of 4</span>` : ''}</div>
      ${kase.hasEvidence ? `<div class="ph" style="margin:14px 20px 0;height:150px">${S.photo ? `<img src="${S.photo}" alt="Evidence photo">` : ICON.xph(350, 150)}<span class="tag">Evidence · Nov 21</span></div>`
        : `<button class="boxed" data-act="chat" style="background:#fff;align-items:center;border-style:dashed;min-height:110px;justify-content:center">${ICON.plus(22)}<b style="font-size:14px">Add photos or video</b></button>`}
      ${finding}
      ${steps}
      ${r ? `<div class="boxed" style="margin-top:8px;padding:12px 14px;gap:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>Evidence: ${ready} of 9 ready</b><span style="text-decoration:underline">Checklist</span></div><div class="progress"><div style="width:${Math.round(ready / 9 * 100)}%"></div></div></div>` : ''}
      <div class="section"><span class="eyebrow">Timeline</span>
        ${g.resolved ? `<div class="tl"><span>Repair confirmed with a photo</span><span>${g.fixedOn}</span></div>` : ''}
        ${g.court ? `<div class="tl"><span>HP action started</span><span>${g.noViolation ? 'Jan 5' : g.dueDate}</span></div>` : ''}
        ${g.violation ? `<div class="tl"><span>HPD ${g.vClass} violation issued</span><span>Dec 18</span></div>` : ''}
        ${g.noViolation ? '<div class="tl"><span>HPD inspection: no violation</span><span>Dec 18</span></div>' : ''}
        ${g.filed ? '<div class="tl"><span>311 complaint filed</span><span>Dec 5</span></div>' : ''}
        ${kase.sent ? '<div class="tl"><span>Notice sent to landlord</span><span>Nov 21</span></div>' : ''}
        ${kase.hasEvidence ? '<div class="tl"><span>Photos and description added</span><span>Nov 21</span></div>' : ''}
        <div class="tl"><span>Case started</span><span>Nov 21</span></div>
        ${S.type === 'mould' ? '<div class="tl"><span>Texted the super (2nd time)</span><span>Oct 28</span></div><div class="tl"><span>Texted the super</span><span>Oct 14</span></div>' : ''}
      </div>
    </div>
    <div class="foot"><button class="primary-btn" data-act="chat">Continue in chat</button>${r ? '<button class="ghost-btn">Export evidence packet (PDF)</button>' : ''}</div>`;
}

/* ---------- bottom sheet: all cases ---------- */
function sheetView(kase, animate) {
  const current = kase ? `<button class="casecard" data-act="open-case"><span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:16px">${esc(kase.title)}</b>${kase.res ? `<span class="badge">${esc(kase.res.cls)}</span>` : ''}</span><span class="sub" style="font-size:13px">${esc(kase.status)}</span></button>` : '';
  return `
    <div class="nav">
      <button class="back" data-act="close-sheet">${ICON.back}${S.prevView === 'case' ? 'Case' : 'Chat'}</button>
      <h1 class="navtitle" style="margin:0">Your cases</h1>
      <span></span>
    </div>
    <div class="cases-page">
      <div class="sheet-body">
        <div class="home"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:15px">[Address], Apt 4B, Bronx</b><span class="sub" style="font-size:13px">Rent-stabilized · built 1928 · Home details</span></span>${ICON.chev}</div>
        <span class="eyebrow" style="padding-top:6px">Open</span>
        ${current}
        <div class="casecard quiet"><span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:16px">Kitchen sink leak</b><span class="badge" style="border-color:#B3A595">Inspector decides</span></span><span class="sub" style="font-size:13px">311 filed Nov 2 · inspection pending</span></div>
        <span class="eyebrow" style="padding-top:8px">Closed</span>
        <div class="casecard closed"><span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:16px;color:var(--soft)">Bedroom smoke detector</b><span class="sub">Fixed</span></span><span class="sub" style="font-size:13px">Resolved Sep 30 · repair confirmed on video</span></div>
      </div>
      <div class="sheet-foot"><button class="primary-btn" data-act="new">${ICON.plus(20)} New case</button></div>
    </div>`;
}

const STATUS_BAR = `<div class="statusbar" aria-hidden="true"><span class="time">9:41</span><span class="sb-icons">
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.4c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .6 10.4 10.4 0 0 0 .8 3.5L2 4.8a8.6 8.6 0 0 1 6-2.4zm0 3.5c1.3 0 2.5.5 3.5 1.3l1.2-1.3A7 7 0 0 0 8 4.1 7 7 0 0 0 3.3 5.9l1.2 1.3A5.2 5.2 0 0 1 8 5.9zm0 3.4c.4 0 .8.1 1.1.4L8 11.4 6.9 9.7c.3-.3.7-.4 1.1-.4z" fill="currentColor"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
</span></div>`;
function openCount(kase) { return 1 + (kase && !kase.diy && !(kase.stage && kase.stage.resolved) ? 1 : 0); }

let lastChips = [];
let sheetWasOpen = false;
function render() {
  const app = document.getElementById('app');
  const conv = conversation();
  lastChips = conv.chips;
  const base = S.view === 'cases' ? sheetView(conv.kase)
    : S.view === 'case' && conv.kase ? caseView(conv.kase) : chatView(conv);
  app.innerHTML = STATUS_BAR + base + '<div class="homebar" aria-hidden="true"></div>';
  const sc = document.getElementById('scroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

/* ---------- events ---------- */
function startCase(type, typedDesc) {
  set({ type, step: 1, desc: typedDesc || null, typedFirst: !!typedDesc }, 600);
}
function addEvidence(patch) { set(Object.assign({ step: 2 }, patch), 900); }

document.addEventListener('click', (e) => {
  const sug = e.target.closest('[data-type]');
  if (sug) { startCase(sug.dataset.type); return; }
  const chip = e.target.closest('[data-chip]');
  if (chip) {
    const c = lastChips[+chip.dataset.chip];
    if (!c) return;
    if (c.attach) { S.awaitVerify = !!c.verify; document.getElementById('file').click(); } else c.go();
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  e.preventDefault();
  const act = a.dataset.act;
  if (act === 'case') { if (S.type) set({ view: 'case' }); else set({ prevView: S.view, view: 'cases' }); }
  else if (act === 'cases') set({ prevView: S.view, view: 'cases' });
  else if (act === 'close-sheet') set({ view: S.prevView || 'chat' });
  else if (act === 'open-case') set({ view: 'case' });
  else if (act === 'chat') set({ view: 'chat' });
  else if (act === 'new') set(Object.assign({ view: 'chat' }, FRESH));
  else if (act === 'attach') { S.awaitVerify = false; document.getElementById('file').click(); }
  else if (act === 'copy') a.textContent = 'Copied';
  else if (act === 'mail') a.textContent = 'Opening…';
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'composer') return;
  e.preventDefault();
  const v = document.getElementById('msg').value.trim();
  if (!v) return;
  if (!S.type) startCase(guessType(v), v);
  else if (S.step === 1) addEvidence({ desc2: v });
});

document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  e.target.value = '';
  if (S.awaitVerify) { set({ verified: true, afterPhoto: url, awaitVerify: false }, 700); return; }
  const typed = document.getElementById('msg') ? document.getElementById('msg').value.trim() : '';
  const patch = Object.assign({ photo: url }, typed ? { desc2: typed } : {});
  if (!S.type) Object.assign(S, { type: guessType(typed), typedFirst: false });
  if (S.step < 2) addEvidence(patch); else set(patch);
  e.target.value = '';
});

render();
</script>
</body>
</html>
