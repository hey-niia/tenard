<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111111; --muted: #6B6B6B; --soft: #3A3A3A; --line: #E6E6E6; --line2: #D6D6D6; --bubble: #EEEEEE; --bg: #FFFFFF; --cream: #EEEEEE; --accent: #111111; --yellow: #F6D04D; --desk: #E3E3E3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--desk); font-family: Inter, system-ui, sans-serif; color: var(--ink); }
  body { display: flex; align-items: center; justify-content: center; }
  .phone { width: 390px; height: min(844px, 100dvh); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.12); }
  @media (max-width: 500px) { body { display: block; } .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; } }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--ink); }
  .bar { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 6px; border-bottom: 1px solid var(--line); }
  .icon { width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 22px; }
  .pill { flex: 1; min-width: 0; height: 44px; border: 1.5px solid var(--ink); border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 12px; text-align: left; }
  .pill b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill small { font-size: 11px; color: var(--muted); }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bot { max-width: 86%; background: var(--bubble); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 15px; line-height: 1.45; white-space: pre-line; }
  .user { max-width: 80%; background: var(--ink); color: var(--cream); border-radius: 14px 14px 4px 14px; padding: 10px 12px; font-size: 15px; line-height: 1.45; }
  .ph { position: relative; overflow: hidden; background: #F2F2F2; border: 1px solid #B5B5B5; border-radius: 12px; }
  .ph svg { position: absolute; inset: 0; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag { position: absolute; bottom: 8px; left: 8px; font-size: 11px; background: #fff; border: 1px solid #B5B5B5; border-radius: 6px; padding: 2px 6px; }
  .card { width: 300px; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff; overflow: hidden; }
  .pad { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .chip-lbl { font-size: 11px; font-weight: 600; border: 1px solid var(--ink); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tile { border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
  .big { font-size: 18px; font-weight: 700; }
  .sub { font-size: 12px; color: var(--muted); }
  .sys { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--soft); border: 0; background: none; padding: 6px 0; }
  .sys::before, .sys::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
  .sug { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 8px 12px; border: 0; border-top: 1px solid #EEEEEE; background: #fff; text-align: left; }
  .sug:hover { background: #F6F6F6; }
  .sug .plus { width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; }
  .sug b { display: block; font-size: 15px; }
  .btnrow { display: flex; border-top: 1px solid var(--line); }
  .btnrow button { flex: 1; height: 44px; border: 0; border-right: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 500; }
  .btnrow button.primary { flex: 1.4; background: var(--ink); color: var(--cream); font-weight: 600; border-right: 0; }
  .shop { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid #EEEEEE; text-decoration: none; }
  .shop .th { width: 44px; height: 44px; border: 1px solid #B5B5B5; border-radius: 6px; flex-shrink: 0; }
  .shop b { display: block; font-size: 14px; }
  .chips { flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 8px 16px; }
  .chip { min-height: 40px; border: 1.5px solid var(--ink); border-radius: 999px; background: #fff; padding: 0 14px; font-size: 14px; font-weight: 600; }
  .chip.dark { background: var(--ink); color: var(--cream); }
  .input { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px 20px; border-top: 1px solid var(--line); }
  .input input[type=text] { flex: 1; min-width: 0; height: 44px; border: 1px solid #B5B5B5; border-radius: 22px; padding: 0 16px; font: inherit; font-size: 15px; }
  .round { width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
  .round.out { border: 1px solid #B5B5B5; background: #fff; }
  .round.fill { border: 0; background: var(--ink); color: var(--cream); }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 6px; height: 6px; border-radius: 3px; background: #B5B5B5; animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  .page { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
  .section { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .boxed { margin: 14px 20px 0; border: 1px solid var(--line2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .boxed.strong { border: 1.5px solid var(--ink); }
  .step { display: flex; gap: 12px; }
  .step .rail { display: flex; flex-direction: column; align-items: center; width: 22px; }
  .step .dot { width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid var(--ink); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step .dot.done { background: var(--ink); color: var(--cream); }
  .step .ln { width: 1.5px; flex: 1; background: var(--line2); }
  .step .txt { padding-bottom: 12px; display: flex; flex-direction: column; gap: 2px; }
  .step b { font-size: 15px; } .step span { font-size: 13px; color: var(--muted); }
  .tl { display: flex; justify-content: space-between; font-size: 14px; }
  .tl span:last-child { color: var(--muted); }
  .foot { flex-shrink: 0; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
  .primary-btn { height: 52px; border: 0; border-radius: 10px; background: var(--ink); color: var(--cream); font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ghost-btn { height: 44px; border: 1px solid #B5B5B5; border-radius: 10px; background: #fff; font-size: 15px; font-weight: 500; }
  .casecard { border: 1.5px solid var(--ink); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: #fff; text-align: left; width: 100%; }
  .casecard.quiet { border: 1px solid var(--line2); }
  .casecard.closed { border: 1px solid var(--line); }
  .bar2 { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .progress { height: 6px; background: #E6E6E6; border-radius: 3px; overflow: hidden; }
  .progress div { height: 6px; background: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* ---------- iOS conventions ---------- */
  html, body, button, input { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .phone { position: relative; border-radius: 48px; }
  .statusbar { height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 46px; color: var(--ink); }
  .statusbar .time { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
  .sb-icons { display: flex; align-items: center; gap: 6px; }
  .homebar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 8; pointer-events: none; }
  @media (max-width: 500px) { .statusbar, .homebar { display: none; } .phone { padding-top: env(safe-area-inset-top); border-radius: 0; } }
  .nav { height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; }
  .nav > :first-child { justify-self: start; } .nav > :last-child { justify-self: end; }
  .navtitle { font-size: 17px; font-weight: 600; letter-spacing: -.4px; text-align: center; }
  .navbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--cream); color: var(--ink); display: flex; align-items: center; justify-content: center; position: relative; }
  .navbtn .count { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; border: 2px solid var(--bg); background: var(--accent); color: var(--cream); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .back { height: 44px; border: 0; background: none; padding: 0 8px 0 0; display: flex; align-items: center; gap: 6px; font-size: 17px; color: var(--ink); }
  .pin { margin: 2px 16px 0; flex-shrink: 0; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 12px; border: 1px solid #E4E4E4; border-radius: 16px; background: var(--cream); text-align: left; color: var(--ink); box-shadow: 0 6px 16px -10px rgba(0, 0, 0, .35); position: relative; z-index: 1; margin-bottom: 4px; }
  .pin .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--cream); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pin .ic svg { width: 20px; height: 20px; }
  .pin b { display: block; font-size: 16px; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pin small { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .scroll { border-top: 0; }
  .bot, .user { font-size: 16px; letter-spacing: -.2px; border-radius: 20px; }
  .bot { border-bottom-left-radius: 6px; } .user { border-bottom-right-radius: 6px; }
  .chip { min-height: 36px; font-size: 15px; letter-spacing: -.2px; }
  .input { padding-bottom: 30px; border-top: .5px solid var(--line2); }
  .input input[type=text] { font-size: 16px; border-radius: 22px; background: #fff; }
  .phone .foot, .phone .sheet-foot { padding-bottom: 30px; }
  .primary-btn { height: 50px; border-radius: 14px; font-size: 17px; letter-spacing: -.3px; }
  .ghost-btn { height: 50px; border-radius: 14px; font-size: 17px; }
  .sheet-head { display: grid !important; grid-template-columns: 1fr auto 1fr; padding: 0 12px 8px 20px !important; }
  .sheet-head .done { justify-self: end; height: 44px; border: 0; background: none; font-size: 17px; font-weight: 600; color: var(--ink); padding: 0 8px; }
  /* pinned case card floats over the chat, with a fade underneath */
  /* the chat runs up under the status bar and nav; nav + case card float on top */
  .phone { --top: 106px; }
  @media (max-width: 500px) { .phone { --top: 52px; } }
  .statusbar, .nav { position: relative; z-index: 4; }
  .chatarea { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: calc(-1 * var(--top)); }
  .chatarea .scroll { flex: 1; padding-top: calc(var(--top) + 16px); }
  .pinwrap { position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: calc(var(--top) + 12px) 16px 40px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255, 255, 255, .94) 0%, rgba(255, 255, 255, .72) 40%, rgba(255, 255, 255, .6) 72%, rgba(255, 255, 255, 0) 100%); }
  .pinwrap .pin { pointer-events: auto; margin: 0; width: 100%; }
  .chatarea .scroll.haspin { padding-top: calc(var(--top) + 104px); }
  /* product cards (ChatGPT-style, horizontal) */
  .prodwrap { display: flex; flex-direction: column; gap: 8px; margin: 2px -16px; }
  .prodcap { padding: 0 16px; font-size: 13px; color: var(--muted); }
  .prodrow { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 6px; scroll-padding: 0 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .prodrow::-webkit-scrollbar { display: none; }
  .prod { flex: 0 0 auto; width: 168px; scroll-snap-align: start; display: flex; flex-direction: column; padding: 8px 8px 14px; border: 1px solid #E6E6E6; border-radius: 22px; background: #FAFAFA; text-decoration: none; color: var(--ink); }
  .prodimg { height: 144px; border: 1px solid #ECECEC; border-radius: 16px; background: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .prodname { margin: 0 6px; font-size: 16px; line-height: 1.3; letter-spacing: -.3px; font-weight: 600; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .prodsub { margin: 6px 6px 0; font-size: 14px; color: var(--muted); }
  .prodprice { margin: 10px 6px 0; font-size: 19px; font-weight: 500; letter-spacing: -.3px; }
  /* empty state */
  .hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 36px 24px; text-align: center; }
  .hero-mark { width: 76px; height: 76px; border-radius: 26px; background: var(--accent); color: var(--cream); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: 0 16px 30px -14px rgba(0, 0, 0, .55); }
  .hero-mark svg { width: 36px; height: 36px; }
  .hero-date { font-size: 15px; color: var(--muted); }
  .hero h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.7px; color: var(--ink); }
  .hero p { margin: 0; font-size: 16px; line-height: 1.4; color: var(--muted); }
  .sugrow { flex-shrink: 0; display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 12px; scroll-padding: 0 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .sugrow::-webkit-scrollbar { display: none; }
  .sugcard { flex: 0 0 auto; width: 272px; scroll-snap-align: start; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border: 1px solid #E6E6E6; border-radius: 22px; background: #fff; text-align: left; color: var(--ink); box-shadow: 0 6px 18px -12px rgba(0, 0, 0, .35); }
  .sugic { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; background: var(--cream); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .sugtxt { display: flex; flex-direction: column; min-width: 0; }
  .sugtxt b { font-size: 16px; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sugtxt span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* composer */
  .composer { flex-shrink: 0; margin: 0 16px 34px; padding: 14px 10px 10px 18px; border: 1px solid #E6E6E6; border-radius: 28px; background: #fff; box-shadow: 0 10px 28px -16px rgba(0, 0, 0, .4); display: flex; flex-direction: column; gap: 10px; }
  .composer input { border: 0; outline: 0; padding: 4px 8px 4px 0; font: inherit; font-size: 17px; letter-spacing: -.3px; color: var(--ink); background: transparent; }
  .composer input::placeholder { color: #A3A3A3; }
  .composer:focus-within { border-color: #BDBDBD; }
  .composer-row { display: flex; align-items: center; gap: 8px; margin-left: -8px; }
  .cbtn { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--cream); color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .cbtn.bare { background: transparent; color: var(--muted); }
  .cpill { height: 40px; padding: 0 14px; border-radius: 20px; background: var(--cream); font-size: 15px; font-weight: 600; display: flex; align-items: center; }
  .csend { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--accent); color: var(--cream); display: flex; align-items: center; justify-content: center; }
  .cases-page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .phone .sheet { border-radius: 38px 38px 0 0; }
  .phone .handle span { width: 36px; }
  .icon.doc { background: var(--cream); }
  .scrim { position: absolute; inset: 0; border: 0; padding: 0; background: rgba(0, 0, 0, .38); z-index: 5; cursor: default; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 86%; z-index: 6; background: var(--bg); border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); display: flex; flex-direction: column; }
  .scrim.in { animation: fade .22s ease-out; }
  .sheet.in { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { .scrim.in, .sheet.in { animation: none; } }
  .handle { align-self: center; width: 80px; height: 24px; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
  .handle span { width: 40px; height: 5px; border-radius: 3px; background: #CFCFCF; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px 20px; }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 20px 12px; display: flex; flex-direction: column; gap: 10px; }
  .sheet-foot { padding: 12px 20px 22px; }
  .sheet-foot .primary-btn { width: 100%; }
  .home { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border: 1px solid #E6E6E6; border-radius: 22px; background: #fff; text-align: left; color: var(--ink); box-shadow: 0 6px 18px -12px rgba(0, 0, 0, .35); }
  .badge { font-size: 12px; font-weight: 600; border: 1px solid var(--ink); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  /* cards in the chat: white, light border, soft shadow */
  .phone .card { border: 1px solid #E6E6E6; border-radius: 22px; box-shadow: 0 6px 18px -12px rgba(0, 0, 0, .35); }
  .fcard { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .fhead { display: flex; align-items: center; gap: 12px; }
  .ftile { background: #F4F4F4; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .frule { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 0 14px; border: 1.5px solid #D9D9D9; border-radius: 999px; background: #fff; color: #333; font-size: 14px; font-weight: 500; text-align: left; }
  .frule svg { color: #666; flex-shrink: 0; }
  .fmeta { gap: 6px; font-size: 14px; }
  .fmeta > span { display: flex; gap: 8px; } .fmeta .sub { width: 52px; flex-shrink: 0; font-size: 13px; padding-top: 1px; }
  .fbody { margin: 0 2px; font-size: 15px; line-height: 1.5; color: #333; }
  .fattach { display: flex; align-items: center; gap: 10px; }
  .fattach img, .fthumb { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: #F0F0F0; }
  .factions { display: flex; gap: 8px; }
  .factions .fbtn.primary { flex: 1; }
  .fbtn { min-height: 40px; padding: 0 14px; white-space: nowrap; border: 1.5px solid #D9D9D9; border-radius: 999px; background: #fff; color: #333; font-size: 15px; font-weight: 500; }
  .fbtn.primary { border-color: var(--yellow); background: var(--yellow); color: #111; font-weight: 600; }
  .flist { display: flex; flex-direction: column; }
  .fitem { display: flex; align-items: center; gap: 10px; min-height: 42px; border-top: 1px solid #F0F0F0; font-size: 14px; }
  .fcheck { width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; border: 1.5px solid #CFCFCF; display: flex; align-items: center; justify-content: center; }
  .fcheck.ok { border: 0; background: var(--yellow); color: #111; }
  .fadd { border: 0; background: #F2F2F2; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  /* reply suggestions: stacked outline pills with an arrow */
  .phone .chips { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 8px; padding: 6px 16px 12px; }
  .phone .chips.inline { flex-direction: row; flex-wrap: wrap; }
  /* home screen */
  .home-page { display: flex; flex-direction: column; padding: 4px 16px 24px; }
  .home-page > * { flex-shrink: 0; }
  .hcover { position: relative; height: 168px; border-radius: 22px; overflow: hidden; background: #EEE; }
  .hcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hcover-tag { position: absolute; left: 10px; bottom: 10px; font-size: 11px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 3px 8px; color: #444; }

function set(patch, botDelay) {
  if (botDelay) {
    S.typing = true; render();
    setTimeout(() => { Object.assign(S, patch, { typing: false }); render(); }, botDelay);
  } else { Object.assign(S, patch); render(); }
}
const go = (patch) => () => set(patch, 700);

/* ---------- the conversation ---------- */
function conversation() {
  const m = [];
  const bot = (t) => m.push({ t: 'bot', text: t });
  const user = (t) => m.push({ t: 'user', text: t });
  let chips = [];

  if (!S.type) {
    if (!S.offscope) return { m, chips, kase: null, empty: true };
    user(S.offscope.text);
    bot(OFFSCOPE[S.offscope.kind]);
    chips = Object.entries(TYPES).map(([k, T]) => ({ label: T.label, go: () => startCase(k) }));
    return { m, chips, kase: null };
  }

  const T = TYPES[S.type];
  user(S.typedFirst ? S.desc : '+ ' + T.label);
  m.push({ t: 'system', text: T.title });
  bot('Case started. ' + T.ask);

  let res = null, title = T.title, status = 'New · add evidence', diy = false;
  if (S.step >= 2) {
    const evText = S.desc2 || (S.typedFirst ? null : (S.desc || T.desc));
    if (evText) user(evText);
    m.push({ t: 'photo', tag: T.tag, fallback: T.photo });
    status = 'Checking';
    if (S.type === 'mould') {
      bot('I can see mould on the ceiling, about 15 sq ft, next to a water stain. That usually means a leak from above.\n\nTwo quick questions so I check the right rules.');
      bot('Is it inside your apartment, or in a hallway or laundry room?');
      if (S.step === 2) chips = [{ label: 'Inside my apartment', go: go({ step: 3 }) }, { label: 'Hallway or laundry', go: go({ step: 3 }) }];
      if (S.step >= 3) {
        user('Inside my apartment');
        bot('Is it only on tile, grout or caulk, or on the ceiling or wall?');
        if (S.step === 3) chips = [{ label: 'On the ceiling', go: go({ step: 4, path: 'ceiling' }) }, { label: 'Only on tile or grout', go: go({ step: 4, path: 'tile' }) }];
      }
      if (S.step >= 4 && S.path === 'tile') {
        user('Only on tile or grout');
        bot("Then it's not a violation. Surface mould on intact tile, grout or caulk is usually the tenant's to clean. These would do it:");
        m.push({ t: 'shop' });
        bot("If it comes back fast or spreads past the tile, film it again. That can mean a leak behind the wall, and that's your landlord's job.");
        title = 'Shower grout mould'; status = 'Not a violation · yours to fix'; diy = true;
        chips = [{ label: 'Film it again', go: go({ step: 1 }) }];
      }
      if (S.step >= 4 && S.path === 'ceiling') { user('On the ceiling'); res = MOULD_RES; }
    } else {
      bot(T.see);
      bot(T.q);
      if (S.step === 2) chips = T.opts.map((o) => ({ label: o.label, go: go({ step: 4, answer: o.r, answerLabel: o.label }) }));
      if (S.step >= 4) { user(S.answerLabel); res = T.res[S.answer]; }
    }
  }

  if (res) {
    title = res.title;
    status = res.cls + ' · new';
    m.push({ t: 'finding', res });
    bot(res.say);
    if (S.asked) {
      user('Will I get in trouble for complaining?');
      bot("It's illegal for your landlord to punish you for complaining. If they try to evict you or raise your rent within a year of a complaint or inspection, the law presumes it's retaliation (NY Real Property Law § 223-b).\n\nThis doesn't apply if the owner lives in a building with fewer than 4 units.");
    }
    if (S.step === 4) {
      chips = [{ label: 'What do I do now?', go: go({ step: 5 }) }];
      if (!S.asked) chips.push({ label: 'Will I get in trouble?', go: go({ asked: true }) });
    }
    if (S.step >= 5) {
      user('What do I do now?');
      bot('Step 1: tell your landlord in writing. HPD and Housing Court both expect that first. I drafted it for you. Keep a copy and proof it was delivered.');
      m.push({ t: 'draft', title, res });
      status = res.cls + ' · notice ready';
      if (S.step === 5) chips = [{ label: 'I sent it', go: go({ step: 6 }) }];
    }
    if (S.step >= 6) {
      user('I sent it');
      bot("Saved to your case. I'll check in on Dec 5. If it isn't fixed by then, we'll file a 311 complaint together so HPD inspects.");
      status = res.cls + ' · waiting on landlord';
      if (S.step === 6) chips = [{ label: 'Skip to Dec 5', dark: true, go: go({ step: 7 }) }, { label: 'Open my case', go: () => set({ view: 'case' }) }];
    }
  }

  /* ---------- escalation: notice → 311 → HPD inspection → violation → HP action ---------- */
  const vClass = res && res.label === 'Inspector decides' ? 'Class B' : res ? res.cls : '';
  const vDays = res && res.label === 'Inspector decides' ? '30 days' : res ? res.days : '';
  const dueDate = { '21 days': 'Jan 8', '30 days': 'Jan 17', '90 days': 'Mar 18' }[vDays] || 'Jan 17';
  let fixedOn = null;
  const verify = (when) => {
    fixedOn = when;
    user('Fixed');
    bot('Good news. Send a photo of the repaired spot so your case has proof it was done.');
    if (!S.verified) {
      chips = [];
    } else {
      m.push({ t: 'photo', tag: 'Photo · after the repair', after: true, fallback: T.photoFixed });
      bot('Case closed. It stays in your record, so if the problem comes back you can reopen it with the full history.');
      m.push({ t: 'system', text: title, closed: true });
      status = 'Resolved · ' + when;
      chips = [];
    }
  };

  if (res && S.step >= 7) {
    m.push({ t: 'date', text: 'Dec 5 · check-in' });
    bot("It's Dec 5. Did your landlord fix it?");
    if (S.step === 7 && !S.fixed) chips = [{ label: 'Not fixed', go: go({ step: 8 }) }, { label: 'Fixed', go: go({ fixed: true }) }];
    if (S.step === 7 && S.fixed) verify('Dec 5');
  }
  if (res && S.step >= 8) {
    user('Not fixed');
    bot("Then it's time to file with 311, so HPD sends an inspector. Here's your complaint in the city's own categories. Paste it into 311 online, or read it out on the phone.");
    m.push({ t: 'complaint', title, T });
    bot("When you file, you'll get a service request number. Send it to me and I'll track the inspection.");
    status = res.cls + ' · file with 311';
    if (S.step === 8) chips = [{ label: 'I filed it', go: go({ step: 9 }) }];
  }
  if (res && S.step >= 9) {
    user('Filed. My number is 311-[number]');
    bot("Saved to your case. HPD aims to inspect within 30 days. If the inspector can't get in, call 311 within 10 days to reschedule.\n\nYour landlord can't punish you for this complaint.");
    status = res.cls + ' · waiting for inspection';
    if (S.step === 9) chips = [{ label: 'Skip to the inspection', dark: true, go: go({ step: 10 }) }];
  }
  if (res && S.step >= 10) {
    m.push({ t: 'date', text: 'Dec 18 · inspection' });
    bot('How did the HPD inspection go?');
    if (S.missed) {
      user("The inspector couldn't get in");
      bot("Call 311 within 10 days to reschedule, and give them your service request number. Tell me how it goes when they come back.");
    }
    if (S.step === 10) {
      chips = [{ label: 'Violation issued', go: go({ step: 11, insp: 'violation' }) }, { label: 'No violation', go: go({ step: 11, insp: 'none' }) }];
      if (!S.missed) chips.push({ label: "Couldn't get in", go: go({ missed: true }) });
    }
  }
  if (res && S.step >= 11 && S.insp === 'violation') {
    user('They issued a violation');
    bot(`HPD issued a ${vClass} violation. It's now public on HPDONLINE, and your landlord's deadline starts today: fix by ${dueDate}.\n\nThis is the official record a court will look at.`);
    status = `${vClass} violation · fix by ${dueDate}`;
    if (S.step === 11) chips = [{ label: 'Skip to ' + dueDate, dark: true, go: go({ step: 12 }) }];
  }
  if (res && S.step >= 11 && S.insp === 'none') {
    user('No violation');
    bot("That happens. If the problem is still there, you don't have to stop. When HPD hasn't issued a violation within 30 days of your complaint, you can ask Housing Court to order the repair. That's called an HP action.");
    status = res.cls + ' · no violation issued';
    if (S.step === 11) chips = [{ label: 'Go to Housing Court', go: go({ step: 13 }) }];
  }
  if (res && S.step >= 12 && S.insp === 'violation') {
    m.push({ t: 'date', text: dueDate + ' · deadline' });
    bot("Today was your landlord's deadline. Did they fix it?");
    if (S.step === 12 && !S.fixed) chips = [{ label: 'Not fixed', go: go({ step: 13 }) }, { label: 'Fixed', go: go({ fixed: true }) }];
    if (S.step === 12 && S.fixed) verify(dueDate);
  }
  if (res && S.step >= 13) {
    user(S.insp === 'none' ? 'Go to Housing Court' : 'Not fixed');
    bot("Then you can ask Housing Court to order the repair. That's an HP action. The court clerk gives you the forms, and your case already has most of what the judge will want to see:");
    m.push({ t: 'checklist' });
    bot('You also have the right to talk to a free tenant lawyer before you go.' + (RENT_STABILIZED ? "\n\nBecause you're rent-stabilized, you can also ask DHCR to lower your rent until it's fixed." : ''));
    status = 'HP action · Housing Court';
    if (S.exported) m.push({ t: 'file', title });
    chips = S.exported ? [{ label: 'Open my case', dark: true, go: () => set({ view: 'case' }) }] : [{ label: 'Export evidence packet', dark: true, go: go({ exported: true }) }];
  }

  const stage = {
    filed: !!res && S.step >= 9, violation: !!res && S.step >= 11 && S.insp === 'violation', noViolation: !!res && S.step >= 11 && S.insp === 'none',
    court: !!res && S.step >= 13, resolved: !!res && S.verified, fixedOn, vClass, dueDate, filing: !!res && S.step === 8
  };
  return { m, chips, kase: { title, status, res, diy, T, sent: S.step >= 6, hasEvidence: S.step >= 2, stage } };
}

function draftBody(title, res) {
  if (S.type === 'mould') return 'There is mould on the bathroom ceiling of Apt 4B, about 15 sq ft, caused by a leak from above. I reported it to the super on Oct 14 and Oct 28. Under the NYC Housing Maintenance Code (§ [section]) this is a hazardous (Class B) condition…';
  const cond = res.label === 'Inspector decides' ? 'a condition you are required to repair' : `a ${res.cls} condition`;
  const extra = S.type === 'window' && S.answer === 1 ? ' Please treat this letter as my written request for window guards.' : '';
  return `I am writing about a problem in Apt 4B: ${title.toLowerCase()}. Photos are attached. Under the NYC Housing Maintenance Code (§ [section]) this is ${cond}.${extra} Please repair it…`;
}

function msgHTML(x) {
  switch (x.t) {
    case 'bot': return `<div class="row"><div class="bot">${esc(x.text)}</div></div>`;
    case 'user': return `<div class="row me"><div class="user">${esc(x.text)}</div></div>`;
    case 'suggest': return `<div class="row"><div class="card">
      <div style="padding:12px 12px 10px"><span class="eyebrow">Start a case</span></div>
      ${Object.entries(TYPES).map(([k, T]) => `<button class="sug" data-type="${k}"><span class="plus">${ICON.plus(16)}</span><span style="flex:1"><b>${esc(T.label)}</b><span class="sub">${esc(T.hint)}</span></span></button>`).join('')}
      </div></div>`;
    case 'photo': {
      const upload = x.after ? S.afterPhoto : S.photo;
      const src = upload || x.fallback;
      return `<div class="row me"><div class="ph" style="width:220px;${src ? '' : 'height:170px'}">${src ? `<img src="${src}" alt="Your photo" style="height:auto;max-height:290px">` : ICON.xph(220, 170)}<span class="tag">${upload ? 'Your upload' : esc(x.tag)}</span></div></div>`;
    }
    case 'system': return `<button class="sys" data-act="case"><span style="text-align:center;max-width:75%">${x.closed ? 'Case resolved' : 'Case started'}: <b style="color:#111111">${esc(x.text)}</b> · Open</span></button>`;
    case 'date': return `<div style="text-align:center;padding:10px 0 2px"><span style="font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 10px">${esc(x.text)}</span></div>`;
    case 'complaint': return `<div class="row"><div class="card fcard">
      <div class="fhead"><span class="sugic">${ICON.megaphone}</span><span class="sugtxt" style="flex:1"><b>311 complaint</b><span>Ready to file · goes to HPD</span></span></div>
      <div class="ftile"><span class="sub">Complaint type</span><b style="font-size:15px">[311 type] › [HPD category]</b></div>
      <div class="grid2"><div class="ftile"><span class="sub">Where</span><b style="font-size:15px">${esc(x.T.where)}</b></div><div class="ftile"><span class="sub">Apartment</span><b style="font-size:15px">4B</b></div></div>
      <p class="fbody">${esc(x.title)}. Written notice to landlord sent Nov 21 with photos. Not repaired as of Dec 5.</p>
      <div class="factions"><button class="fbtn" data-act="copy">Copy text</button><button class="fbtn primary" data-act="mail">Open 311 online</button></div></div></div>`;
    case 'checklist': {
      const items = [
        ['Dated photos and video', true], ['Written notice to landlord · Nov 21', true], ['311 service request number', true],
        ['HPD violation number (HPDONLINE)', S.insp === 'violation'], ['Proof the notice was delivered', false],
        ['Lease and rent receipts', false], ['How it affects you, in your words', false]
      ];
      const done = items.filter((i) => i[1]).length;
      return `<div class="row"><div class="card fcard">
        <div class="fhead"><span class="sugic">${ICON.list}</span><span class="sugtxt" style="flex:1"><b>Evidence for court</b><span>${done} of ${items.length} ready</span></span></div>
        <div class="progress"><div style="width:${Math.round(done / items.length * 100)}%;background:var(--yellow)"></div></div>
        <div class="flist">${items.map(([label, ok]) => `<div class="fitem"><span class="fcheck${ok ? ' ok' : ''}">${ok ? ICON.check : ''}</span><span style="flex:1${ok ? '' : ';color:var(--soft)'}">${esc(label)}</span>${ok ? '' : '<button class="fadd">Add</button>'}</div>`).join('')}</div>
        <button class="frule" data-act="checklist"><span>Open the full checklist</span>${ICON.arrowNE}</button>
      </div></div>`;
    }
    case 'file': return `<div class="row"><div class="card fcard">
      <div class="fhead"><span class="sugic" style="font-size:12px;font-weight:800;letter-spacing:.04em">PDF</span><span class="sugtxt" style="flex:1"><b>Evidence packet</b><span>${esc(x.title)} · dated, in order</span></span></div>
      <div class="factions"><button class="fbtn primary">Download</button></div></div></div>`;
    case 'finding': {
      const lc = { 'Settled': 'green', 'Inspector decides': 'blue', 'From HPD records': 'grey', 'Not settled': 'orange' }[x.res.label] || 'grey';
      return `<div class="row"><div class="card fcard">
      <div class="fhead"><span class="sugic">${ICON.scale}</span><span class="sugtxt" style="flex:1"><b>Possible violation</b><span>NYC Housing Maintenance Code</span></span></div>

      <span class="stage ${lc}" style="margin-top:0">${esc(x.res.label)}</span>

    }
    case 'draft': {

      <div class="fhead"><span class="sugic">${ICON.mail}</span><span class="sugtxt" style="flex:1"><b>Letter to your landlord</b><span>Draft · you send it</span></span></div>
      <div class="ftile fmeta"><span><span class="sub">To</span>[Landlord / management]</span><span><span class="sub">Subject</span>Repair request: ${esc(x.title)}, Apt 4B</span></div>
      <p class="fbody">${esc(draftBody(x.title, x.res))}</p>
      <div class="fattach">${thumb ? `<img src="${thumb}" alt="">` : '<span class="fthumb"></span>'}<span class="sub">Photo attached</span></div>
      <div class="factions"><button class="fbtn">Edit</button><button class="fbtn" data-act="copy">Copy</button><button class="fbtn primary" data-act="mail">Open in email</button></div></div></div>`;
    }
    case 'shop': return `<div class="prodwrap">
      <span class="prodcap">Fix it yourself · from Shopify stores</span>
      <div class="prodrow" role="list">
        ${PRODUCTS.map((p) => `<a class="prod" role="listitem" href="#"><span class="prodimg">${p.img}</span><b class="prodname">${esc(p.name)}</b><span class="prodsub">${esc(p.sub)}</span><span class="prodprice">$[price]</span></a>`).join('')}
      </div></div>`;
  }
  return '';
}

/* ---------- views ---------- */
function chatView(conv) {
  const { m, chips, kase } = conv;
  const pin = kase
    ? `<button class="pin" data-act="case"><span class="ic">${ICON.doc}</span><span style="flex:1;min-width:0"><b>${esc(kase.title)}</b><small>${esc(kase.status)}</small></span>${ICON.chev}</button>`
    : '';
  const typing = S.typing ? `<div class="row"><div class="bot"><span class="typing"><i></i><i></i><i></i></span></div></div>` : '';
  const attachLabel = S.type && S.step === 1 ? 'Add photo or video' : (S.fixed && !S.verified) ? 'Add photo of the repair' : null;
  const placeholder = S.step === 1 ? 'Where, since when, who you told' : 'Describe the problem, any language';
  return `
    <div class="nav">
      <button class="navbtn" aria-label="Your cases, ${openCount(kase)} open" data-act="cases">${ICON.doc}<span class="count" aria-hidden="true">${openCount(kase)}</span></button>
      <span class="navtitle"></span>
      ${kase ? `<button class="navbtn" aria-label="Start a new case" data-act="new">${ICON.compose}</button>` : '<span></span>'}
    </div>
    ${conv.empty ? `
    <div class="hero">
      <h1>Your rights as a tenant, made simple.</h1>    </div>
    <div class="sugrow" role="list" aria-label="Start a case">
      ${Object.entries(TYPES).map(([k, T]) => `<button class="sugcard" role="listitem" data-type="${k}"><span class="sugic">${TYPE_ICON[k]}</span><span class="sugtxt"><b>${esc(T.label)}</b><span>${esc(T.hint)}</span></span></button>`).join('')}
    </div>`
    : `<div class="chatarea">
      ${pin ? `<div class="pinwrap">${pin}</div>` : ''}
      <div class="scroll${pin ? ' haspin' : ''}" id="scroll">${m.map(msgHTML).join('')}${typing}</div>
    </div>
    <div class="chips${chips.every((c) => c.label.length <= 18) || chips.reduce((n, c) => n + c.label.length, 0) <= 30 ? ' inline' : ''}">${S.typing ? '' : chips.map((c, i) => `<button class="chip${c.dark ? ' dark' : ''}" data-chip="${i}"><span>${esc(c.label)}</span>${ICON.arrowNE}</button>`).join('')}</div>`}
    <form class="composer" id="composer">
      <input type="text" id="msg" aria-label="Message" placeholder="${conv.empty ? "Tell us what's wrong at home" : placeholder}" autocomplete="off">
      <div class="composer-row">
        ${attachLabel
          ? `<button type="button" class="cbtn wide" data-act="attach">${ICON.cam}<span>${attachLabel}</span></button>`
          : `<button type="button" class="cbtn" aria-label="Add photo or video" data-act="attach">${ICON.plus(20)}</button>`}
        <span style="flex:1"></span>
        <button type="button" class="cbtn bare" aria-label="Talk instead of typing">${ICON.mic}</button>
        <button type="submit" class="csend" aria-label="Send">${ICON.arrowUp}</button>
      </div>
    </form>`;
}

/* What HPD or Housing Court will want to see, and whether the case has it yet. */
function evidenceItems(kase) {
  const g = kase.stage, has = (k) => S.docs.includes(k);
  return [
    { label: 'Dated photos and video', sub: 'Added in the chat · Nov 21', ok: kase.hasEvidence },
    { label: 'Your description of the problem', sub: 'Where, since when, who you told', ok: kase.hasEvidence },
    { label: 'The rule, class and deadline', sub: kase.res ? `${kase.res.cls} · ${kase.res.days}` : 'After the check in the chat', ok: !!kase.res },
    { label: 'Written notice to landlord', sub: kase.sent ? 'Sent Nov 21' : 'Draft ready in the chat', ok: kase.sent },
    { label: 'Proof the notice was delivered', sub: 'A sent email, a receipt or a delivery confirmation', ok: has('delivery'), add: 'delivery' },
    { label: '311 service request number', sub: g.filed ? '311-[number] · filed Dec 5' : 'After you file with 311', ok: g.filed },
    { label: 'HPD violation number', sub: g.violation ? 'On HPDONLINE · issued Dec 18' : 'After an HPD inspection', ok: g.violation },
    { label: 'Lease and rent receipts', sub: 'Shows you are the tenant and pay rent', ok: has('lease'), add: 'lease' },
    { label: 'How it affects you', sub: 'Health, rooms you can’t use, costs', ok: has('impact'), add: 'impact' }
  ];
}
function checklistView(kase) {
  const items = evidenceItems(kase);
  const ready = items.filter((i) => i.ok).length;
  return `
    <div class="nav">
      <button class="back" data-act="close-checklist">${ICON.back}Case</button>
      <h1 class="navtitle" style="margin:0">Evidence</h1>
      <span></span>
    </div>
    <div class="page home-page">
      <div class="hhead" style="margin-top:6px"><span class="sugic">${ICON.list}</span><span class="sugtxt" style="flex:1"><b style="font-size:19px">${ready} of ${items.length} ready</b><span>${esc(kase.title)}</span></span></div>
      <div class="progress"><div style="width:${Math.round(ready / items.length * 100)}%;background:var(--yellow)"></div></div>
      <span class="sub" style="margin:12px 4px 0;line-height:1.45;font-size:14px">This is what HPD or a Housing Court judge will want to see. Tenard dates everything and puts it in order for you.</span>
      <span class="hlabel">Still needed</span>
      <div class="hcard hlist">${items.filter((i) => !i.ok).map((i) => `<div class="hrow cstep"><span class="cdot"></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">${esc(i.label)}</span><span class="sub">${esc(i.sub)}</span></span>${i.add ? `<button class="fadd" data-act="add-doc:${i.add}">Add</button>` : '<span class="sub" style="white-space:nowrap">Later</span>'}</div>`).join('') || '<div class="hrow cstep"><span style="font-size:15px">Everything is ready.</span></div>'}</div>
      <span class="hlabel">Ready</span>
      <div class="hcard hlist">${items.filter((i) => i.ok).map((i) => `<div class="hrow cstep"><span class="cdot done">${ICON.check}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">${esc(i.label)}</span><span class="sub">${esc(i.sub)}</span></span></div>`).join('') || '<div class="hrow cstep"><span class="sub">Nothing yet</span></div>'}</div>
    </div>
    <div class="foot"><button class="primary-btn">Export evidence packet (PDF)</button></div>`;
}

function caseView(kase) {
  if (!kase) return '';
  const r = kase.res;
  const g = kase.stage;
  const [statusMain, statusSub] =
    g.resolved ? ['Resolved', 'Repair confirmed with a photo · ' + g.fixedOn]
    : g.court ? ['HP action · Housing Court', S.exported ? 'Evidence packet exported' : 'Export the evidence packet in the chat']
    : g.violation ? [`HPD ${g.vClass} violation`, 'Landlord must fix by ' + g.dueDate]
    : g.noViolation ? ['No violation issued', 'You can still start an HP action']
    : g.filed ? ['Waiting for HPD inspection', '311 filed Dec 5 · HPD aims to inspect within 30 days']
    : g.filing ? ['File with 311', 'Complaint text ready in the chat']
    : kase.sent ? ['Waiting on landlord', 'Notice sent Nov 21 · follow up Dec 5']
    : kase.diy ? ['Yours to fix', 'Not a violation · products suggested in chat']
    : r ? ['Notice not sent yet', 'Draft ready in the chat']
    : kase.hasEvidence ? ['Checking', 'Answer a quick question in the chat']
    : ['Add evidence', 'Photos, video and a short description'];
  const stepNow = g.court ? 4 : (g.violation || g.noViolation) ? 3 : g.filed || g.filing ? 2 : 1;
  const [stage, stageColor] = stageOf(kase);
  const labelColor = r ? ({ 'Settled': 'green', 'Inspector decides': 'blue', 'From HPD records': 'grey', 'Not settled': 'orange' }[r.label] || 'grey') : 'grey';
  const photo = S.photo || kase.T.photo;
  const doneSteps = g.resolved ? 4 : (kase.sent ? 1 : 0) + (g.filed ? 1 : 0) + (g.violation || g.noViolation ? 1 : 0) + (g.court ? 1 : 0);

  const finding = r ? `<div class="hcard">
      <div class="fhead"><span class="sugic">${ICON.scale}</span><span class="sugtxt" style="flex:1"><b>Possible violation</b><span>NYC Housing Maintenance Code § [section]</span></span></div>
      <div class="grid2"><div class="ftile"><span class="big">${esc(r.cls)}</span><span class="sub">${esc(r.sub)}</span></div><div class="ftile"><span class="big">${esc(r.days)}</span><span class="sub">${esc(r.daysSub)}</span></div></div>
      <span class="stage ${labelColor}" style="margin:0">${esc(r.label)}</span>
      ${S.type === 'mould' ? '<div class="hline"><span>Water stain (leak)</span><span class="stage blue" style="margin:0">Inspector decides</span></div>' : ''}
      <span class="sub" style="line-height:1.4">Not an official finding. Only an HPD inspector can issue a violation.</span>
    </div>`
    : kase.diy ? `<div class="hcard"><div class="fhead"><span class="sugic">${TYPE_ICON.mould}</span><span class="sugtxt" style="flex:1"><b>Not a violation</b><span>Yours to clean</span></span></div><span style="font-size:15px;line-height:1.45;color:#333">Surface mould on intact tile, grout or caulk is the tenant's to clean. Film it again if it spreads past the tile.</span></div>`
    : `<div class="hcard"><span style="font-size:15px;line-height:1.45;color:#333">${kase.hasEvidence ? 'Answer the question in the chat to finish the check.' : 'Add photos and a description in the chat. Tenard will check it against the rules.'}</span></div>`;

  const step = (done, current, n, title, sub) => `<div class="hrow cstep"><span class="cdot${done ? ' done' : current ? ' now' : ''}">${done ? ICON.check : n}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">${title}</span><span class="sub">${sub}</span></span></div>`;
  const steps = r ? `<span class="hlabel">Steps</span><div class="hcard hlist">
      ${step(kase.sent, !kase.sent, 1, 'Written notice to landlord', kase.sent ? 'Sent Nov 21' : 'Draft ready in the chat')}
      ${step(g.filed, kase.sent && !g.filed, 2, '311 complaint → HPD inspection', g.filed ? 'Filed Dec 5 · 311-[number]' : 'If not fixed by Dec 5 · HPD aims to inspect within 30 days')}
      ${step(g.violation, g.filed && !g.violation && !g.noViolation, 3, 'HPD issues a violation', g.violation ? `${g.vClass} · issued Dec 18 · fix by ${g.dueDate}` : g.noViolation ? 'Inspected Dec 18 · no violation issued' : "The landlord's deadline starts here")}
      ${step(g.court, (g.violation || g.noViolation) && !g.court, 4, 'HP action in Housing Court', g.court ? (S.exported ? 'Evidence packet ready for the clerk' : 'Started · export the evidence packet') : "If the violation isn't fixed")}
    </div>` : '';

  const items = evidenceItems(kase);
  const ready = items.filter((i) => i.ok).length;
  const evidence = r ? `<span class="hlabel">Evidence</span><button class="hcard hcard-btn" data-act="checklist">
      <div style="display:flex;justify-content:space-between;align-items:baseline;width:100%"><b style="font-size:16px">${ready} of ${items.length} ready</b><span class="sub">for HPD or Housing Court</span></div>
      <div class="progress" style="width:100%"><div style="width:${Math.round(ready / items.length * 100)}%;background:var(--yellow)"></div></div>
      <span class="frule" style="width:100%"><span>Open the checklist</span>${ICON.arrowNE}</span>
    </button>` : '';

  const tl = [];
  if (g.resolved) tl.push(['Repair confirmed with a photo', g.fixedOn]);
  if (g.court) tl.push(['HP action started', g.noViolation ? 'Jan 5' : g.dueDate]);
  if (g.violation) tl.push([`HPD ${g.vClass} violation issued`, 'Dec 18']);
  if (g.noViolation) tl.push(['HPD inspection: no violation', 'Dec 18']);
  if (g.filed) tl.push(['311 complaint filed', 'Dec 5']);
  if (kase.sent) tl.push(['Notice sent to landlord', 'Nov 21']);
  if (kase.hasEvidence) tl.push(['Photos and description added', 'Nov 21']);
  tl.push(['Case started', 'Nov 21']);
  if (S.type === 'mould') tl.push(['Texted the super (2nd time)', 'Oct 28'], ['Texted the super', 'Oct 14']);

  return `
    <div class="nav">
      <button class="back" data-act="chat">${ICON.back}Chat</button>
      <span class="navtitle">Case</span>
      <button class="navbtn" aria-label="Your cases, ${openCount(kase)} open" data-act="cases">${ICON.doc}<span class="count" aria-hidden="true">${openCount(kase)}</span></button>
    </div>
    <div class="page home-page">
      <div class="hhead" style="margin-top:6px"><span class="sugic">${TYPE_ICON[S.type]}</span><span class="sugtxt" style="flex:1;white-space:normal"><b style="font-size:20px;white-space:normal">${esc(kase.title)}</b><span>1415 Morris Ave, Apt 4B · started Nov 21</span></span></div>

      <div class="hcard">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="stage ${stageColor}" style="margin:0">${esc(stage)}</span><span class="sub">${g.resolved ? 'Closed' : r ? `Step ${stepNow} of 4` : ''}</span></div>
        <div style="display:flex;flex-direction:column;gap:2px">${statusMain !== stage ? `<b style="font-size:17px">${statusMain}</b>` : ''}<span style="font-size:15px;color:#333">${statusSub}</span></div>
        ${r ? `<div class="segs">${[1, 2, 3, 4].map((n) => `<span class="${n <= doneSteps ? 'on' : n === doneSteps + 1 ? 'now' : ''}"></span>`).join('')}</div>` : ''}
      </div>

      ${kase.hasEvidence
        ? `<span class="hlabel">Photo</span><div class="hcover" style="height:200px">${photo ? `<img src="${photo}" alt="Evidence photo">` : ''}<span class="hcover-tag">Evidence · Nov 21</span></div>`
        : `<button class="hcard hadd" data-act="chat">${ICON.plus(22)}<b style="font-size:15px">Add photos or video</b></button>`}

      ${r || kase.diy ? '<span class="hlabel">What we found</span>' : ''}${finding}
      ${steps}
      ${evidence}

      <span class="hlabel">Timeline</span>
      <div class="hcard hlist">${tl.map(([t, d]) => `<div class="hrow" style="min-height:48px;cursor:default"><span style="flex:1;font-size:15px">${esc(t)}</span><span class="sub" style="font-size:14px">${esc(d)}</span></div>`).join('')}</div>
    </div>
    <div class="foot"><button class="primary-btn" data-act="chat">Continue in chat</button>${r ? '<button class="ghost-btn">Export evidence packet (PDF)</button>' : ''}</div>`;
}

/* ---------- bottom sheet: all cases ---------- */
function sheetView(kase, animate) {
  const card = (title, sub, stage, color, act) => `<${act ? `button data-act="${act}"` : 'div'} class="casecard"><b style="font-size:16px">${esc(title)}</b><span class="sub" style="font-size:13px">${esc(sub)}</span><span class="stage ${color}">${esc(stage)}</span></${act ? 'button' : 'div'}>`;
  const cardFor = (k, act) => {
    const [stage, color] = stageOf(k);
    return card(k.title, k.res ? `${k.res.cls} · started Nov 21` : 'Started Nov 21', stage, color, act);
  };
  // the current case first, then cases saved when "New case" was pressed
  const all = [];
  if (kase) all.push({ k: kase, act: 'open-case' });
  S.cases.forEach((snap, i) => { if (snap.type) all.push({ k: kaseFor(snap), act: `open-saved:${i}` }); });
  const open = all.filter((c) => !c.k.stage.resolved).map((c) => cardFor(c.k, c.act)).join('');
  const done = all.filter((c) => c.k.stage.resolved).map((c) => cardFor(c.k, c.act)).join('');
  const closedCount = 1 + all.filter((c) => c.k.stage.resolved).length;
  const closed = `
        <button class="closed-toggle" data-act="toggle-closed" aria-expanded="${!!S.showClosed}"><span>Closed · ${closedCount}</span><span class="chev${S.showClosed ? ' open' : ''}">${ICON.chev}</span></button>
        ${S.showClosed ? done + card('Bedroom smoke detector', 'Resolved Sep 30 · repair confirmed on video', 'Fixed', 'green') : ''}`;
  const current = open;
  return `
    <div class="nav">
      <button class="back" data-act="close-sheet">${ICON.back}${S.prevView === 'case' ? 'Case' : 'Chat'}</button>
      <h1 class="navtitle" style="margin:0">Your cases</h1>
      <span></span>
    </div>
    <div class="cases-page">
      <div class="sheet-body">
        <button class="home" data-act="home"><span class="sugic">${ICON.house}</span><span class="sugtxt" style="flex:1"><b>1415 Morris Ave, Apt 4B</b><span>Bronx · rent-stabilized · built 1928</span></span>${ICON.chev}</button>
        <span class="eyebrow" style="padding-top:6px">Open</span>
        ${current}
        ${card('Kitchen sink leak', '311 filed Nov 2 · inspector decides the class', 'Inspection pending', 'blue')}
        ${closed}
        <button class="reset-demo" data-act="reset">Reset demo data</button>
      </div>
      <div class="sheet-foot"><button class="primary-btn" data-act="new">${ICON.plus(20)} New case</button></div>
    </div>`;
}

const STATUS_BAR = `<div class="statusbar" aria-hidden="true"><span class="time">9:41</span><span class="sb-icons">
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.4c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .6 10.4 10.4 0 0 0 .8 3.5L2 4.8a8.6 8.6 0 0 1 6-2.4zm0 3.5c1.3 0 2.5.5 3.5 1.3l1.2-1.3A7 7 0 0 0 8 4.1 7 7 0 0 0 3.3 5.9l1.2 1.3A5.2 5.2 0 0 1 8 5.9zm0 3.4c.4 0 .8.1 1.1.4L8 11.4 6.9 9.7c.3-.3.7-.4 1.1-.4z" fill="currentColor"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
</span></div>`;
function stageOf(k) {
  const g = k.stage;
  return g.resolved ? ['Fixed', 'green'] : g.court ? ['Housing Court', 'red'] : g.violation ? ['HPD violation', 'orange']
    : g.noViolation ? ['No violation issued', 'orange'] : g.filed ? ['Inspection pending', 'blue'] : g.filing ? ['File with 311', 'yellow']
    : k.sent ? ['Waiting on landlord', 'yellow'] : k.diy ? ['Yours to fix', 'grey'] : k.res ? ['Notice ready', 'yellow'] : ['New', 'grey'];
}
/* open cases: the sample kitchen leak, the current case, and saved ones that aren't resolved */
function openCount(kase) {
  const isOpen = (k) => k && !k.diy && !k.stage.resolved;
  return 1 + (isOpen(kase) ? 1 : 0) + S.cases.filter((s) => s.type && isOpen(kaseFor(s))).length;
}

let lastChips = [];
let sheetWasOpen = false;
function render() {
  const app = document.getElementById('app');
  const conv = conversation();
  lastChips = conv.chips;
  const base = S.view === 'checklist' && conv.kase ? checklistView(conv.kase) : S.view === 'home' ? homeView() : S.view === 'cases' ? sheetView(conv.kase)
    : S.view === 'case' && conv.kase ? caseView(conv.kase) : chatView(conv);
  app.innerHTML = STATUS_BAR + base + '<div class="homebar" aria-hidden="true"></div>';
  const sc = document.getElementById('scroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
  if (!S.typing) saveState();
}

/* ---------- events ---------- */
function startCase(type, typedDesc) {
  set({ type, step: 1, desc: typedDesc || null, typedFirst: !!typedDesc, offscope: null }, 600);
}
function addEvidence(patch) { set(Object.assign({ step: 2 }, patch), 900); }

document.addEventListener('click', (e) => {
  const sug = e.target.closest('[data-type]');
  if (sug) { startCase(sug.dataset.type); return; }
  const chip = e.target.closest('[data-chip]');
  if (chip) {
    const c = lastChips[+chip.dataset.chip];
    if (!c) return;
    if (c.attach) { S.awaitVerify = !!c.verify; document.getElementById('file').click(); } else c.go();
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  e.preventDefault();
  const act = a.dataset.act;
  if (act === 'case') { if (S.type) set({ view: 'case' }); else set({ prevView: S.view, view: 'cases' }); }
  else if (act === 'cases') set({ prevView: S.view, view: 'cases' });
  else if (act === 'close-sheet') set({ view: S.prevView || 'chat' });
  else if (act === 'toggle-closed') set({ showClosed: !S.showClosed });
  else if (act === 'home') set({ view: 'home' });
  else if (act === 'checklist') set({ view: 'checklist' });
  else if (act === 'close-checklist') set({ view: 'case' });
  else if (act.startsWith('add-doc:')) { S.awaitDoc = act.split(':')[1]; S.awaitVerify = false; document.getElementById('file').click(); }
  else if (act === 'close-home') set({ view: 'cases' });
  else if (act === 'open-case') set({ view: 'case' });
  else if (act === 'chat') set({ view: 'chat' });
  else if (act === 'new') { archiveCurrent(); set(Object.assign({ view: 'chat' }, FRESH)); }
  else if (act.startsWith('open-saved:')) {
    const snap = S.cases.splice(+act.split(':')[1], 1)[0];
    archiveCurrent();
    set(Object.assign({}, FRESH, snap, { view: 'case' }));
  }
  else if (act === 'reset') {
    try { localStorage.removeItem(STORE); } catch (err) { /* nothing saved */ }
    S.cases = [];
    S.home = Object.assign({}, HOME_DEFAULT);
    set(Object.assign({ view: 'chat', showClosed: false }, FRESH));
  }
  else if (act === 'attach') { S.awaitVerify = !!(S.fixed && !S.verified); document.getElementById('file').click(); }
  else if (act === 'copy') a.textContent = 'Copied';
  else if (act === 'mail') a.textContent = 'Opening…';
});

document.addEventListener('change', (e) => {
  const key = e.target.dataset && e.target.dataset.home;
  if (!key) return;
  S.home[key] = e.target.checked;
  render();
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'composer') return;
  e.preventDefault();
  const v = document.getElementById('msg').value.trim();
  if (!v) return;
  if (!S.type) {
    const type = guessType(v);
    if (type) startCase(type, v);
    else set({ offscope: { text: v, kind: offScopeKind(v) } }, 700);
  }
  else if (S.step === 1) addEvidence({ desc2: v });
  else if (S.fixed && !S.verified) set({ verified: true }, 700);
});

document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  e.target.value = '';
  if (S.awaitDoc) { const key = S.awaitDoc; S.awaitDoc = null; set({ docs: S.docs.concat(key) }); return; }
  if (S.awaitVerify) { set({ verified: true, afterPhoto: url, awaitVerify: false }, 700); return; }
  const typed = document.getElementById('msg') ? document.getElementById('msg').value.trim() : '';
  const patch = Object.assign({ photo: url }, typed ? { desc2: typed } : {});
  if (!S.type) Object.assign(S, { type: guessType(typed) || 'mould', typedFirst: false, offscope: null });
  if (S.step < 2) addEvidence(patch); else set(patch);
  e.target.value = '';
});

loadState();
render();
</script>
</body>
</html>
